name: Publish
on:
  push: { branches: [main] }
  schedule:
    - cron: "40 6 * * 1-5"       # the feeds are settled into two small files each weekday morning
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Settle the feeds
        if: ${{ github.event_name != 'push' }}
        run: |
          python tools/precompute.py
          git config user.name "pwlb-benchmark-bot"
          git config user.email "philsmith871010@gmail.com"
          git add data/peers.json data/pwlb-loans.json
          git diff --cached --quiet || git commit -m "Feeds $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
